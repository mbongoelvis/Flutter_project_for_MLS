<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Flavr — AI-powered personalized food suggestions">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Flavr">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Flavr</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#E8633A">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #FFF8F3;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #FFF8F3;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .logo-circle {
      width: 80px;
      height: 80px;
      border-radius: 24px;
      background: linear-gradient(135deg, #E8633A, #C44D25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(232, 99, 58, 0.35);
    }

    .app-name {
      font-size: 32px;
      font-weight: 700;
      color: #1A1209;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .app-tagline {
      font-size: 14px;
      color: #6B5744;
      margin-bottom: 40px;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(232, 99, 58, 0.2);
      border-top-color: #E8633A;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Instant splash shown while Flutter loads -->
  <div id="splash">
    <div class="logo-circle">🍽️</div>
    <div class="app-name">Flavr</div>
    <div class="app-tagline">Your AI food companion</div>
    <div class="spinner"></div>
  </div>

  <script>
    // Hide splash once Flutter renders its first frame
    window.addEventListener('flutter-first-frame', function() {
      var splash = document.getElementById('splash');
      splash.classList.add('hidden');
      setTimeout(function() { splash.remove(); }, 400);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
