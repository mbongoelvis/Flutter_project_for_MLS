name: PR Check

on:
  pull_request:
    branches: [main]

jobs:
  check:
    name: Analyze & Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Download Nunito fonts
        run: |
          mkdir -p assets/fonts
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/nunito/Nunito%5Bwght%5D.ttf" \
            -o assets/fonts/Nunito-Regular.ttf
          cp assets/fonts/Nunito-Regular.ttf assets/fonts/Nunito-SemiBold.ttf
          cp assets/fonts/Nunito-Regular.ttf assets/fonts/Nunito-Bold.ttf

      - name: Generate web icons
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p web/icons
          for size in 192 512; do
            convert -size ${size}x${size} xc:'#E8633A' \
              -fill white -font DejaVu-Sans-Bold -pointsize $((size/3)) \
              -gravity Center -annotate 0 'F' \
              web/icons/Icon-${size}.png
            cp web/icons/Icon-${size}.png web/icons/Icon-maskable-${size}.png
          done
          convert -size 32x32 xc:'#E8633A' -fill white \
            -font DejaVu-Sans-Bold -pointsize 18 \
            -gravity Center -annotate 0 'F' web/favicon.png

      - name: Generate platform structure
        run: |
          flutter create --platforms android,web \
            --org com.flavr \
            --project-name flavr \
            --overwrite \
            .

      - name: Create dummy .env for build check
        run: echo "GEMINI_API_KEY=dummy_key_for_ci" > .env

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Build web (verify it compiles)
        run: flutter build web --release --web-renderer canvaskit
