name: Build & Deploy Flavr

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # allow manual trigger from GitHub UI

# Allow GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # ─── 1. ANALYZE ──────────────────────────────────────────────────────────────
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Download Nunito fonts
        run: |
          mkdir -p assets/fonts
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/nunito/Nunito%5Bwght%5D.ttf" \
            -o assets/fonts/Nunito-Regular.ttf
          cp assets/fonts/Nunito-Regular.ttf assets/fonts/Nunito-SemiBold.ttf
          cp assets/fonts/Nunito-Regular.ttf assets/fonts/Nunito-Bold.ttf

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

  # ─── 2. BUILD WEB ────────────────────────────────────────────────────────────
  build-web:
    name: Build Web
    runs-on: ubuntu-latest
    needs: analyze
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Download Nunito fonts
        run: |
          mkdir -p assets/fonts
          # Nunito[wght].ttf is a variable font — covers all weights (400/600/700)
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/nunito/Nunito%5Bwght%5D.ttf" \
            -o assets/fonts/Nunito-Regular.ttf
          cp assets/fonts/Nunito-Regular.ttf assets/fonts/Nunito-SemiBold.ttf
          cp assets/fonts/Nunito-Regular.ttf assets/fonts/Nunito-Bold.ttf

      - name: Generate web icons
        run: |
          sudo apt-get install -y imagemagick
          mkdir -p web/icons
          for size in 192 512; do
            convert -size ${size}x${size} xc:'#E8633A' \
              -fill white -font DejaVu-Sans-Bold -pointsize $((size/3)) \
              -gravity Center -annotate 0 'F' \
              web/icons/Icon-${size}.png
            cp web/icons/Icon-${size}.png web/icons/Icon-maskable-${size}.png
          done
          convert -size 32x32 xc:'#E8633A' -fill white \
            -font DejaVu-Sans-Bold -pointsize 18 \
            -gravity Center -annotate 0 'F' web/favicon.png

      - name: Generate web platform structure
        run: |
          flutter create --platforms web \
            --org com.flavr \
            --project-name flavr \
            --overwrite \
            .

      - name: Inject .env from GitHub Secret
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Build Flutter Web
        run: |
          flutter build web \
            --release \
            --base-href "/" \
            --web-renderer canvaskit

      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # ─── 3. DEPLOY TO GITHUB PAGES ───────────────────────────────────────────────
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4

  # ─── 4. BUILD ANDROID APK ────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: analyze
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Download Nunito fonts
        run: |
          mkdir -p assets/fonts
          curl -fsSL "https://github.com/google/fonts/raw/main/ofl/nunito/Nunito%5Bwght%5D.ttf" \
            -o assets/fonts/Nunito-Regular.ttf
          cp assets/fonts/Nunito-Regular.ttf assets/fonts/Nunito-SemiBold.ttf
          cp assets/fonts/Nunito-Regular.ttf assets/fonts/Nunito-Bold.ttf

      - name: Generate Android project structure
        run: |
          flutter create --platforms android \
            --org com.flavr \
            --project-name flavr \
            --overwrite \
            .

      - name: Inject .env from GitHub Secret
        run: echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      - name: Build Android APK (release, no signing)
        run: flutter build apk --release --no-shrink

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flavr-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
